name: 測試安裝器視窗

# 在 Windows 上實際打開安裝器、按安裝與移除，截圖存到 ci-shots 分支（手動執行）
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: 編譯
        working-directory: installer
        run: go build -trimpath -ldflags "-s -w -H=windowsgui" -o ..\SC-zhTW-Installer.exe .
      - name: 建立假的遊戲資料夾與語言包
        shell: pwsh
        run: |
          $live = 'C:\Program Files\Roberts Space Industries\StarCitizen\LIVE'
          New-Item -ItemType Directory -Force -Path $live | Out-Null
          New-Item -ItemType File -Force -Path "$live\Data.p4k" | Out-Null
          Set-Content -Path "$live\user.cfg" -Value "r_DisplayInfo = 0"
          $dl = Join-Path $env:USERPROFILE 'Downloads'
          New-Item -ItemType Directory -Force -Path $dl | Out-Null
          $tmp = Join-Path $env:RUNNER_TEMP 'pkg'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $lines = @('Frontend_PU_Version=Alpha 4.10.2: Siege of Orison') + (1..20000 | ForEach-Object { "test_key_$_=測試文字 $_" })
          [IO.File]::WriteAllLines("$tmp\global.ini", $lines, (New-Object Text.UTF8Encoding $true))
          Compress-Archive -Path "$tmp\global.ini" -DestinationPath "$dl\global_zh-TW.zip" -Force
      - name: 打開視窗、按安裝與移除、截圖
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $out = Join-Path $env:RUNNER_TEMP 'shots'; New-Item -ItemType Directory -Force -Path $out | Out-Null
          function Note($t) { $t | Out-File -Encoding utf8 -Append "$out\result.txt" }
          trap { Note "錯誤：$_ （第 $($_.InvocationInfo.ScriptLineNumber) 行）"; continue }
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$out\$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          Add-Type -TypeDefinition @"
          using System; using System.Runtime.InteropServices;
          public static class W {
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr FindWindowW(string c, string t);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr FindWindowExW(IntPtr p, IntPtr a, string c, string t);
            [DllImport("user32.dll")] public static extern IntPtr GetDlgItem(IntPtr d, int id);
            [DllImport("user32.dll")] public static extern bool PostMessageW(IntPtr h, uint m, IntPtr w, IntPtr l);
            public static IntPtr Child(IntPtr p, string text) { return FindWindowExW(p, IntPtr.Zero, "Button", text); }
            public static void Click(IntPtr h) { PostMessageW(h, 0x00F5, IntPtr.Zero, IntPtr.Zero); }
          }
          "@
          $title = 'SC 繁中語言包安裝器'
          function DlgButton($ids) {
            for ($i = 0; $i -lt 20; $i++) {
              $d = [W]::FindWindowW('#32770', $title)
              if ($d -ne [IntPtr]::Zero) {
                foreach ($id in $ids) { $b = [W]::GetDlgItem($d, $id); if ($b -ne [IntPtr]::Zero) { return $b } }
              }
              Start-Sleep -Milliseconds 300
            }
            Note "找不到對話框按鈕 $ids"; return [IntPtr]::Zero
          }
          $live = 'C:\Program Files\Roberts Space Industries\StarCitizen\LIVE'
          $p = Start-Process -FilePath .\SC-zhTW-Installer.exe -PassThru
          Start-Sleep -Seconds 6; Shot '1-open'
          if ($p.HasExited) { Note "程式已結束，代碼 $($p.ExitCode)"; exit 0 }
          $main = [W]::FindWindowW('SCzhTWInstaller', [NullString]::Value)
          Note "主視窗：$main"
          # 安裝：按鈕 → 確認「是」(6) → 完成「確定」(1/2)
          [W]::Click([W]::Child($main, '安裝中文化'))
          Start-Sleep 2; Shot '2-confirm'
          [W]::Click((DlgButton @(6)))
          Start-Sleep 3; Shot '3-done'
          [W]::Click((DlgButton @(2, 1)))
          Start-Sleep 2; Shot '4-after-install'
          Note "── 安裝後 user.cfg ──"
          Get-Content "$live\user.cfg" | ForEach-Object { Note $_ }
          $ini = "$live\Data\Localization\chinese_(traditional)\global.ini"
          if (Test-Path $ini) { $bytes = [IO.File]::ReadAllBytes($ini); Note "global.ini bytes=$($bytes.Length) bom=$($bytes[0]),$($bytes[1]),$($bytes[2])" } else { Note "global.ini 不存在" }
          # 移除：按鈕 → 確認「是」→ 完成「確定」
          [W]::Click([W]::Child($main, '移除中文化（變回英文）'))
          Start-Sleep 2
          [W]::Click((DlgButton @(6)))
          Start-Sleep 2
          [W]::Click((DlgButton @(2, 1)))
          Start-Sleep 2; Shot '5-after-remove'
          Note "── 移除後 user.cfg ──"
          Get-Content "$live\user.cfg" | ForEach-Object { Note $_ }
          Get-ChildItem -Recurse -File "$live\語言包備份" -ErrorAction SilentlyContinue | ForEach-Object { Note $_.FullName }
          Stop-Process -Id $p.Id -ErrorAction SilentlyContinue
      - name: 把截圖存到 ci-shots 分支
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          Remove-Item -Force SC-zhTW-Installer.exe -ErrorAction SilentlyContinue
          git switch --orphan ci-shots
          git rm -rf --quiet . 2>$null
          Get-ChildItem -Force | Where-Object { $_.Name -ne '.git' } | Remove-Item -Recurse -Force
          Copy-Item "$env:RUNNER_TEMP\shots\*" .
          git add -A
          git commit -m "安裝器截圖 $(Get-Date -Format s)"
          git push -f origin ci-shots
